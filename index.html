<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Living Forest Memory</title>
  <style>
    :root{
      --FOREST_BG: url("./forest-bg.jpeg");
      --LEAVES_PNG: url("./leaves.png");
      --WALT_PHOTO: url("./walt-1966.jpg");

      --text: rgba(255,255,255,.92);
      --shadow: rgba(0,0,0,.55);
      --veil: rgba(0,0,0,.35);
    }

    html, body { margin:0; padding:0; height:100%; background:#000; overflow-x:hidden; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }

    /* The module occupies scroll space, but the scene stays “present” */
    .module {
      position: relative;
      width: 100%;
      height: 260vh; /* controls how long the reveal takes */
      background: #000;
    }

    .scene {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 100%;
      overflow: hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      isolation:isolate;
    }

    /* Background “breathing” + slow drift */
    .bg {
      position:absolute;
      inset:-6%;
      background-image: var(--FOREST_BG);
      background-size: cover;
      background-position: center;
      filter: none;
      transform: scale(1.06);
      animation: drift 18s ease-in-out infinite alternate;
      will-change: transform;
      z-index: 0;
    }
    @keyframes drift {
      from { transform: scale(1.08) translate3d(-0.8%, -0.6%, 0); }
      to   { transform: scale(1.10) translate3d( 0.8%,  0.6%, 0); }
    }

    /* Veil for readability */
.veil{
  background: radial-gradient(
    circle at 50% 55%,
    rgba(0,0,0,0.06),
    rgba(0,0,0,0.14)
  );
}


    /* Leaves overlay (optional) */
    .leaves {
      position:absolute; inset:-10%;
      background-image: var(--LEAVES_PNG);
      background-size: cover;
      background-position:center;
      opacity:.10;
      mix-blend-mode: normal;
      filter: blur(.2px);
      transform: translate3d(0,0,0);
      will-change: transform, opacity;
      z-index:2;
      pointer-events:none;
    }

/* Walt photo “emerges” */
.photoWrap {
  position: relative;
  width: min(920px, 86vw);
  aspect-ratio: 4 / 3;
  border-radius: 22px;
  overflow: hidden;

  /* Strong grounding without grading the background */
  box-shadow:
    

  transform: translate3d(0, 18px, 0) scale(.985);
  opacity: 0;
  will-change: transform, opacity, filter;
  z-index: 4;
}

.photo {
  position: absolute;
  inset: 0;
  background-image: var(--WALT_PHOTO);
  background-size: contain;      /* keep full Walt */
  background-repeat: no-repeat;
  background-position: center;
  background-color: transparent; /* KEY: no visible letterbox */
  filter: grayscale(.15) contrast(1.05);
  /* EDGE FEATHERING */
  -webkit-mask-image: radial-gradient(
    circle at 50% 45%,
    #000 62%,
    rgba(0,0,0,0.85) 72%,
    rgba(0,0,0,0.45) 82%,
    transparent 96%
  );
          mask-image: radial-gradient(
    circle at 50% 45%,
    #000 62%,
    rgba(0,0,0,0.85) 72%,
    rgba(0,0,0,0.45) 82%,
    transparent 96%
  );
}
.photo::after{
  content:"";
  position:absolute;
  inset:0;

  /* Subtle edge atmosphere */
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);

  /* Only affect the edges, never the face */
  -webkit-mask-image: radial-gradient(
    circle at 50% 50%,
    transparent 70%,
    #000 100%
  );
          mask-image: radial-gradient(
    circle at 50% 50%,
    transparent 70%,
    #000 100%
  );

  pointer-events:none;
}

      transform: scale(1.02);
    }
    .grain {
      position:absolute; inset:0;
      background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,.06), transparent 40%),
        radial-gradient(circle at 70% 70%, rgba(255,255,255,.04), transparent 45%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.02), rgba(255,255,255,.02) 1px, transparent 1px, transparent 3px);
      mix-blend-mode: overlay;
      opacity: .35;
      pointer-events:none;
    }

    /* Quote treatment */
    .copy {
      position:absolute;
      left: 7vw;
      bottom: 13vh;
      max-width: min(1200px, 92vw);
      color: var(--text);
      text-shadow: 0 2px 20px var(--shadow);
      z-index:5;
      opacity: 0;
      transform: translate3d(0, 10px, 0);
      will-change: opacity, transform;
    }
    .kicker {
        font-family: "Avenir Next", system-ui, sans-serif;
        font-weight: 600; /* Demi Bold */
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 14px;
        color: #30C7E5; /* style guide accent */
        margin-bottom: 14px;
    }
  .quote .line {
    display: block;
  }
    .quote {
  font-family: "Avenir Next", system-ui, sans-serif;
  font-weight: 700;
  font-size: clamp(30px, 3.2vw, 48px);
  line-height: 1.15;
  color: #D6F5D6;

  /* layered depth shadows */
  text-shadow:
    0 2px 6px rgba(0,0,0,0.65),
    0 8px 22px rgba(0,0,0,0.45),
    0 0 22px rgba(48,199,229,0.25);

  transition: text-shadow 1600ms ease-in-out;
}
.quote {
  position: relative; /* required for the mask */
}
.quote{
  -webkit-text-stroke: 0.6px rgba(0,0,0,0.25);
}


.quote{
  position: relative;
  isolation: isolate; /* keeps blend effects contained */
}

/* Dense local shadow only where the text is */
.quote::before{
  content:"";
  position:absolute;
  inset:-18px -22px;              /* wrap around the quote */
  border-radius: 22px;

  /* Darkest behind the center-left (where your letters cross Walt) */
  background: radial-gradient(
      circle at 38% 45%,
      rgba(0,0,0,0.85) 0%,
      rgba(0,0,0,0.52) 35%,
      rgba(0,0,0,0.18) 60%,
      rgba(0,0,0,0.00) 78%
    );

  filter: blur(10px);
  z-index: -1;
  pointer-events:none;
}
.quote::after{
  content:"";
  position:absolute;
  inset:-10px -14px;
  border-radius: 18px;

  /* a subtle ink wash that only affects the background beneath text */
  background: rgba(0,0,0,0.18);
  mix-blend-mode: multiply;
  filter: blur(6px);
  z-index: -1;
  pointer-events:none;
}


    .line{
  display:inline-block;
  opacity:0;
  transform: translate3d(0, 8px, 0);
  filter: blur(0.4px);
  transition: opacity 900ms ease, transform 900ms ease, filter 900ms ease;
}

    .attrib {
      font-family: "Avenir Next", system-ui, sans-serif;
      font-weight: 500;
      font-size: 16px;
      color: rgba(214,245,214,0.85);
    }

    /* “Light rays” */
    .rays {
      position:absolute; inset:-30%;
      background: conic-gradient(from 220deg at 50% 20%, rgba(255,255,255,.10), transparent 22%, transparent 60%, rgba(255,255,255,.07));
      filter: blur(10px);
      opacity: .0;
      transform: rotate(-8deg);
      z-index:3;
      pointer-events:none;
      will-change: opacity;
    }
    .copy::before {
  content: "";
  position: absolute;
  inset: -20px -26px;
  background:
    radial-gradient(
      ellipse at left center,
      rgba(0,0,0,0.55),
      rgba(0,0,0,0.25) 50%,
      rgba(0,0,0,0.10) 65%,
      transparent 78%
    );
  z-index: -1;
  border-radius: 26px;
}

/* Base state — no glow, but ready */
.quote {
  text-shadow: 0 0 0 rgba(48,199,229,0);
  transition:
    text-shadow 1400ms ease-in-out;
}

/* Hover — gentle bloom */
.copy:hover .quote {
  text-shadow: 0 0 22px rgba(48,199,229,0.35);
  transition-delay: 200ms;
}


    /* Safe area on phones */
    @supports (padding: env(safe-area-inset-bottom)) {
      .copy { bottom: calc(9vh + env(safe-area-inset-bottom)); }
    }
    #quote .line{
  display:block !important;
  white-space:nowrap;
}
  </style>
</head>
<body>

  <section class="module" id="module">
    <div class="scene" aria-label="Living forest scene">
      <div class="bg"></div>
      <div class="veil"></div>
      
      <div class="leaves" id="leaves"></div>

      <div class="photoWrap" id="photoWrap" role="img" aria-label="Archival photo of Walt receiving an American Forestry Association award">
        <div class="photo"></div>
        <div class="grain"></div>
      </div>

      <div class="copy" id="copy">
        <div class="kicker">A living memory</div>
        <p class="quote" id="quote">
  <span class="line">“In recognition of outstanding service</span>
<span class="line">in the conservation of American resources</span>
<span class="line">of forests, soil, water, wildlife, &amp; recreation.”</span>
</p>


        <div class="attrib">— Walt Disney, 1966</div>
      </div>
    </div>
  </section>

  <script>
  (function(){
    const module = document.getElementById('module');
    const photoWrap = document.getElementById('photoWrap');
    const copy = document.getElementById('copy');
    const rays = document.getElementById('rays'); // may be null
    const tVal = document.getElementById('tVal');

    function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

    function render(){
      // Progress based on where the module is in the viewport.
      // This works even if scroll events don’t fire.
      const rect = module.getBoundingClientRect();
      const total = rect.height - window.innerHeight;
      const t = total > 1 ? clamp((-rect.top) / total, 0, 1) : 0;

      // show debug value
      if (tVal) tVal.textContent = t.toFixed(2);

      // Ease curve
      const ease = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;

      // Photo emerges
      const p = clamp((ease - 0.18) / 0.62, 0, 1);
      photoWrap.style.opacity = p.toFixed(3);
      photoWrap.style.transform =
        `translate3d(0, ${18*(1-p)}px, 0) scale(${0.985 + 0.015*p})`;

      // Copy comes in
      const c = clamp((ease - 0.28) / 0.55, 0, 1);
      copy.style.opacity = c.toFixed(3);
      copy.style.transform = `translate3d(0, ${10*(1-c)}px, 0)`;

// Line-by-line reveal (slow, but never ends washed out)
const lines = document.querySelectorAll('#quote .line');
lines.forEach((el, i) => {
  const delay = i * 0.22;                 // still slow
  const show = clamp((c - delay) / 0.55, 0, 1);

  // IMPORTANT: guarantee full readability once copy is present
  const solid = clamp(c * 1.25, 0, 1);    // ramps to 1 a bit earlier
  const finalOpacity = Math.max(show, solid);

  el.style.opacity = finalOpacity.toFixed(3);
  el.style.transform = `translate3d(0, ${(2.5*(1-show)).toFixed(2)}px, 0)`;
  el.style.filter = `blur(${(0.18*(1-show)).toFixed(2)}px)`;
});


      // Ambient movement

      if (rays) rays.style.opacity = "0";

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  })();
</script>


</body>
</html>
